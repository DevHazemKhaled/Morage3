<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية المبرمج الصغير - الاحتراف من الصفر</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- القائمة الجانبية (Sidebar) -->
    <aside class="sidebar">
        <div class="logo">
            <h2>🚀 Al-Komanda Academy</h2>
            <p>منهج الويب الشامل</p>
        </div>
        <ul class="nav-links">
            <li><a href="#" onclick="loadSection('html')">🌐 لغة HTML (الأساس)</a></li>
            <li><a href="#" onclick="loadSection('css')">🎨 لغة CSS والرسم</a></li>
            <li><a href="#" onclick="loadSection('js')">⚡ لغة JavaScript والـ DOM</a></li>
            <li><a href="#" onclick="loadSection('project')">🏆 المشروع التطبيقي</a></li>
        </ul>
    </aside>

    <!-- المحتوى الرئيسي (Main Content) -->
    <main class="main-content">
        <header class="top-bar">
            <h1 id="page-title">مرحباً بك في الأكاديمية</h1>
            <div class="accessibility-btns">
                <button onclick="readCurrentContent()">🔊 اقرأ الدرس</button>
                <button onclick="stopSpeech()">⏹️ إيقاف</button>
                <button onclick="toggleDarkMode()">🌓 الوضع الليلي</button>
            </div>
        </header>

        <!-- هنا المحتوى بيتغير لوحده بالـ JavaScript -->
        <section id="content-display" class="content-box">
            <!-- المحتوى الافتراضي للبداية -->
            <h2>اختر مساراً من القائمة الجانبية للبدء</h2>
            <p>هذه المنصة صُممت خصيصاً لتعلم تطوير الويب باحترافية تامة وحل مشكلات التعليم البرمجي.</p>
        </section>
    </main>

    <!-- ربط ملفات الجافاسكريبت بالترتيب -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
