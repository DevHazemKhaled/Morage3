<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية الكومندا | Al-Komanda Academy</title>
    <meta property="og:title" content="أكاديمية الكومندا - منهج تطوير ويب متكامل">
    <meta property="og:description" content="خريطة تكيفية لفصول أكاديمية الكومندا مع أدوات وصول وقراءة صوتية.">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <div class="toolbar" id="accessibilityToolbar" role="toolbar" aria-label="شريط إمكانية الوصول">
        <div class="btn-group">
            <button id="fontDec" aria-label="تصغير حجم الخط">أ-</button>
            <button id="fontInc" aria-label="تكبير حجم الخط">أ+</button>
        </div>
        <div class="btn-group">
            <button id="contrastToggle" aria-label="تبديل التباين العالي">🌓 تباين عالي</button>
        </div>
        <div class="btn-group">
            <button id="speakBtn" class="btn-gold" aria-label="استماع إلى الصفحة">🔊 استماع</button>
            <button id="stopSpeakBtn" aria-label="إيقاف القراءة">⏹️ إيقاف</button>
        </div>
    </div>

    <header>
        <h1><span>⚡</span> أكاديمية الكومندا <span>Al-Komanda Academy</span></h1>
        <p>خريطة تكيفية · 5 فصول · وصول شامل</p>
    </header>

    <div class="academy-grid">
        <aside class="sidebar" id="chapterSidebar" role="navigation" aria-label="فصول الأكاديمية">
        </aside>

        <main class="main-content" id="mainContent" role="main" aria-live="polite">
            <div id="contentRenderer">
                <h2>🏁 مرحباً في الكومندا</h2>
                <p>اختر فصلاً من القائمة الجانبية لعرض الدروس والتفاصيل.</p>
                <p class="gold-text">🧠 5 فصول · 43 درساً · مشروع نهائي</p>
            </div>
        </main>
    </div>
</div>

<script src="chapter1.js"></script>
<script src="chapter2.js"></script>
<script src="chapter3.js"></script>
<script src="chapter4.js"></script>
<script src="chapter5.js"></script>
<script src="app.js"></script>
</body>
</html>
