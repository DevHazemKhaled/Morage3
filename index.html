<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة مُراجع - التعليم للجميع</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>منصة مُراجع التعليمية</h1>
        <div class="accessibility-tools">
            <button onclick="changeFontSize(2)">➕ تكبير الخط</button>
            <button onclick="changeFontSize(-2)">➖ تصغير الخط</button>
            <button onclick="toggleHighContrast()">🌓 تباين عالي</button>
            <button onclick="readText()">🔊 اقرأ الدرس</button>
        </div>
    </header>

    <main id="content">
        <h2>ملخص درس البرمجة والذكاء الاصطناعي</h2>
        <p class="readable-text">التعليم هو سلاح الأمم الحديثة. من خلال التكنولوجيا، يمكننا بناء مستقبل أفضل وحل مشكلات مجتمعية حقيقية بكل سهولة ويسر.</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
