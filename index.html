<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة Al-Komanda التعليمية - من الصفر للاحتراف</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- القائمة الجانبية الضخمة (الفصول والدروس) -->
    <aside class="sidebar">
        <div class="logo">
            <h2>🚀 Al-Komanda Academy</h2>
            <p>المنهج الشامل لتطوير الويب</p>
        </div>
        <div id="chapters-container" class="nav-container">
            <!-- الـ JS هتولد الفصول والقوائم المنسدلة هنا أوتوماتيك -->
        </div>
    </aside>

    <!-- المحتوى الرئيسي ومحرر "جرب بنفسك" -->
    <main class="main-content">
        <header class="top-bar">
            <div>
                <span id="chapter-badge">الفصل الأول</span>
                <h1 id="lesson-title">مرحباً بك في الأكاديمية</h1>
            </div>
            <div class="accessibility-btns">
                <button onclick="readCurrentContent()">🔊 استماع صوتي</button>
                <button onclick="stopSpeech()">⏹️ إيقاف</button>
                <button onclick="toggleDarkMode()">🌓 الوضع الليلي</button>
            </div>
        </header>

        <!-- عرض الدرس والشرح -->
        <section id="lesson-content" class="content-box">
            <!-- المحتوى الافتراضي -->
            <p>اختر درساً من القائمة الجانبية في الفصول الخمسة للبدء في رحلة الاحتراف البرمجي.</p>
        </section>

        <!-- قسم جرب بنفسك (محرر كود حي + كونسول وبريفيو) -->
        <section class="playground-box">
            <h3>💻 جرب بنفسك (Interactive Code Playground)</h3>
            <div class="editor-container">
                <textarea id="code-editor" placeholder="اكتب كود الـ HTML أو CSS أو JS هنا..."></textarea>
                <div class="preview-panel">
                    <div class="panel-header">النتيجة الحية (Live Preview) & Console</div>
                    <iframe id="live-preview"></iframe>
                    <div id="console-output">Console: جاهز للتنفيذ...</div>
                </div>
            </div>
            <button class="run-btn" onclick="runUserCode()">▶ تنفيذ الكود الآن</button>
        </section>
    </main>

    <!-- ملفات البيانات والمحرك -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
